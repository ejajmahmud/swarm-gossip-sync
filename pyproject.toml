[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-gossip-sync"
version = "0.1.0"
description = "Peer-to-peer epidemic gossip protocol for distributed agent state synchronization"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
swarm-gossip-sync = "swarm_gossip_sync.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["swarm_gossip_sync*"]
